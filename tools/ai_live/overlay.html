<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI LIVE overlay</title>
<style>
  /* 縦長 9:16（TikTok LIVE 向け）。背景色はクロマキーで抜くなら #00ff00 などに変える */
  :root { --bg: #1b1030; --accent: #ff5fa2; --sub-bg: rgba(20, 10, 40, .78); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; max-width: 56.25vh; margin: 0 auto;
           background: radial-gradient(circle at 50% 30%, #4a2a7a 0%, var(--bg) 70%); overflow: hidden; }
  #char { position: absolute; left: 50%; bottom: 17%; height: 66%; max-width: 92%; object-fit: contain; transform: translateX(-50%); transform-origin: 50% 100%;
          filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); transition: transform .12s; }
  #char.talk { animation: talk .28s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: translateX(-50%) scale(1, 1); } to { transform: translateX(-50%) scale(1.015, .985) translateY(-1.2%); } }
  /* transform を持つ要素は中の absolute の基準になるので、舞台いっぱいに広げておく */
  #idle-breath { position: absolute; inset: 0; animation: breath 3s ease-in-out infinite; }
  @keyframes breath { 50% { transform: translateY(-0.6%); } }
  #name { position: absolute; top: 3%; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 800;
          font-size: 3.2vh; letter-spacing: .1em; text-shadow: 0 2px 8px var(--accent); }
  #sub { position: absolute; left: 5%; right: 5%; bottom: 4%; min-height: 9vh; padding: 1.6vh 2vh; border-radius: 2vh;
         background: var(--sub-bg); border: 2px solid var(--accent); color: #fff; font-size: 2.6vh; line-height: 1.5;
         font-weight: 700; opacity: 0; transition: opacity .25s; }
  #sub.show { opacity: 1; }
  #sub .to { display: block; font-size: 1.8vh; color: var(--accent); margin-bottom: .4vh; }
  .fx { position: absolute; pointer-events: none; }
  .banner { left: 50%; top: 14%; transform: translateX(-50%); padding: 1.2vh 2.4vh; border-radius: 99px; white-space: nowrap;
            background: linear-gradient(90deg, #ff5fa2, #ffb347); color: #fff; font-weight: 800; font-size: 2.4vh;
            animation: pop 3.2s ease forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 10% { opacity: 1; transform: translateX(-50%) scale(1.08); }
                   20% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  .particle { font-size: 4vh; animation: rise var(--d, 2.4s) ease-out forwards; }
  @keyframes rise { from { opacity: 1; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(var(--x), -45vh) scale(1.3); } }
  .burst { width: 1vh; height: 1vh; border-radius: 50%; animation: burst 1.4s ease-out forwards; }
  @keyframes burst { from { opacity: 1; transform: translate(0,0); } to { opacity: 0; transform: translate(var(--x), var(--y)); } }
</style>
</head>
<body>
<div id="stage">
  <div id="name"></div>
  <div id="idle-breath"><img id="char" src="/character" alt=""></div>
  <div id="sub"><span class="to"></span><span class="text"></span></div>
</div>
<script>
  const stage = document.getElementById("stage");
  const charEl = document.getElementById("char");
  const sub = document.getElementById("sub");
  let seen = 0, hideTimer = null;

  const rand = (a, b) => a + Math.random() * (b - a);
  function spawn(cls, html, style, ms) {
    const el = document.createElement("div");
    el.className = "fx " + cls; el.innerHTML = html;
    Object.assign(el.style, style);
    stage.appendChild(el); setTimeout(() => el.remove(), ms);
    return el;
  }
  const EFFECTS = {
    sparkle() { for (let i = 0; i < 14; i++) spawn("particle", "✨", { left: rand(10, 90) + "%", bottom: "20%", "--x": rand(-8, 8) + "vh", "--d": rand(1.6, 2.6) + "s" }, 2800); },
    hearts()  { for (let i = 0; i < 26; i++) spawn("particle", ["💖", "💗", "💕"][i % 3], { left: rand(5, 95) + "%", bottom: rand(5, 25) + "%", "--x": rand(-10, 10) + "vh", "--d": rand(2, 3.2) + "s" }, 3400); },
    fireworks() {
      for (let k = 0; k < 4; k++) setTimeout(() => {
        const cx = rand(20, 80), cy = rand(15, 45), color = ["#ff5fa2", "#ffd54a", "#6ef0ff", "#b388ff"][k];
        for (let i = 0; i < 28; i++) {
          const a = (i / 28) * Math.PI * 2, r = rand(10, 18);
          spawn("burst", "", { left: cx + "%", top: cy + "%", background: color, "--x": Math.cos(a) * r + "vh", "--y": Math.sin(a) * r + "vh" }, 1500);
        }
      }, k * 450);
      EFFECTS.hearts();
    },
  };

  async function tick() {
    try {
      const s = await (await fetch("/state", { cache: "no-store" })).json();
      document.getElementById("name").textContent = s.name;
      charEl.classList.toggle("talk", s.speaking);
      if (s.subtitle) {
        sub.querySelector(".text").textContent = s.subtitle;
        sub.querySelector(".to").textContent = s.to ? "▶ " + s.to + " さんへ" : "";
        sub.classList.add("show");
        clearTimeout(hideTimer);
        if (!s.speaking) hideTimer = setTimeout(() => sub.classList.remove("show"), 4000);
      }
      for (const e of s.effects) {
        if (e.id <= seen) continue;
        seen = e.id;
        if (Date.now() / 1000 - e.t > 5) continue; // 開き直したときに古い演出を再生しない
        (EFFECTS[e.name] || EFFECTS.sparkle)();
        spawn("banner", "", {}, 3300).textContent = e.label;
      }
    } catch (_) { /* 本体が止まっているあいだは何もしない */ }
    setTimeout(tick, 250);
  }
  tick();
</script>
</body>
</html>
