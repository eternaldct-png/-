# ─────────────────────────────────────────────────────────────
# /leads（X営業リスト・DM下書き・自動返信エージェント）の設定
#
# コード変更なしで、ここを書き換えてコミットするだけで反映される。
# 仕組みと運用ルールは docs/sales_leads_setup.md を参照。
# ─────────────────────────────────────────────────────────────

title: "X営業リスト"

# DM文面・エージェントが前提にする「自社と商品」の説明
business:
  company: "ETERNAL d.c.t（エターナルディクト）"
  sender_name: "kazuto"
  service: "個人事業主・中小企業向けのAI導入支援（業務の洗い出し → ChatGPT/Claude等の設定 → 社内で使える仕組みづくりまで伴走）"
  price_range: "15万円〜60万円（内容により個別見積もり）"
  offer: "30分の無料オンライン相談（AIで減らせそうな業務を一緒に洗い出します）"
  # 面談予約ページ（返信してくれた人に案内する）
  booking_url: "https://eternal-interview-booking.onrender.com/book/kazuto"
  # 実績として言ってよいこと（事実だけを書く。ここに無い実績はAIに言わせない）
  achievements:
    - "自社で、SNS投稿文の自動生成ツールを作って運用している"
    - "自社で、面談予約の受付とLINE通知を自動化している"
    - "自社で、オーディション応募の受付・管理画面をAIと一緒に作った"

# ── ① 見込み客を探す（Grok の X検索） ─────────────────────────
collect:
  # xAI のモデル名。動かない場合は https://docs.x.ai のモデル一覧で最新の名前を確認して書き換える
  model: "grok-4"
  # 何日前までの投稿を探すか
  days: 14
  # 1回の検索で取ってくる最大件数（多すぎると精度が落ちる）
  max_results: 10
  # 管理画面のプルダウンに出す検索キーワード（自由入力もできる）
  queries:
    - "個人事業主 AI 使いこなせない"
    - "ChatGPT 仕事 どう使う 自営業"
    - "事務作業 多すぎる 一人社長"
    - "人手不足 業務効率化 中小企業"
    - "見積もり 作成 時間かかる"
    - "予約 電話 対応 大変 お店"
  # 候補に入れない条件（Grokへの指示）
  exclude:
    - "AI導入支援・コンサル・ツールを売っている同業者"
    - "企業の公式広告アカウント・求人・bot"
    - "政治・炎上・愚痴だけで業務の話がない投稿"

# ── ② DM下書き（Claude） ───────────────────────────────────
draft:
  model: "claude-opus-5-5"
  max_chars: 280
  guidelines:
    - "最初の1文で、相手の投稿内容に具体的に触れる（コピペ感を出さない）"
    - "売り込まない。相手の困りごとに対して「こうすれば減らせそう」という小さなヒントを1つ渡す"
    - "最後は「よければ30分の無料相談もしています」程度の軽い一言で終える。URLは最初のDMには入れない"
    - "価格は最初のDMでは出さない"
    - "絵文字は0〜1個。敬語だが硬すぎない"

# 1日に送るDMの目安（超えると管理画面に警告が出る）
daily_send_limit: 20

# ── ③ 返信への自動対応エージェント ───────────────────────────
agent:
  # true にすると /tasks/leads-agent が届いた返信に自動で返事をする
  enabled: true
  # "auto" … 自動で送信する / "approve" … 返信案だけ作り、管理画面でワンクリック承認して送る
  mode: "auto"
  model: "claude-opus-5-5"
  # 1人の相手に自動で返す最大回数（超えたら担当者に引き継ぎ）
  max_auto_replies: 4
  # こちらから最初にDMを送った相手（リストにいる人）以外からのDMにも返信するか
  reply_to_unknown: false
  # 自動で動く時間帯（日本時間）。夜中に即レスすると不自然なので営業時間だけ動かす
  active_hours: [9, 21]
  # 最初の自動返信の末尾につける一文（AIが返していることを明示する）
  disclosure: "※この返信はAIアシスタントがお送りしています。担当者と直接話したい場合は「担当者」と送ってください。"
  # これらの言葉が来たら自動返信を止めて担当者に引き継ぐ（LINEで通知）
  handoff_keywords: ["担当者", "人間", "電話", "契約", "請求", "見積", "値引", "クレーム", "怒"]
  handoff_message: "ありがとうございます。ここからは担当の kazuto から直接ご連絡しますので、少しお待ちください。"
  # これらの言葉が来たら以後一切送らない（配信停止）
  stop_keywords: ["不要", "結構です", "送らないで", "やめて", "迷惑", "停止", "ブロック"]
  stop_message: "失礼いたしました。今後こちらからご連絡することはありません。"
  guidelines:
    - "相手の質問にまず答える。わからないこと・決まっていないことは「担当者から確認してお伝えします」と言い、作り話をしない"
    - "目的は30分の無料相談（booking_url）に進んでもらうこと。ただし相手が乗り気なときだけ案内する"
    - "価格を聞かれたら price_range をそのまま伝え、詳細は相談で、と添える。値引きや契約条件の約束はしない"
    - "achievements に無い実績・数字・事例は言わない"
    - "1回の返信は200文字以内。質問は1つまで"
