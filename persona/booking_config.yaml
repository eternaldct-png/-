# ─────────────────────────────────────────────────────────────
# 予約アプリ設定ファイル（src/booking_app.py）
#
# このファイルを書き換えるだけで、別の事業者向けの予約ツールとして
# デプロイできる（コード変更は不要）。
#
# 例: ネイルサロンなら
#   site.title: "○○ネイル 予約"  event_label: "施術"
#   members: スタッフの一覧
# ─────────────────────────────────────────────────────────────

site:
  title: "面談スケジュール"           # ヘッダーやページタイトルに表示
  subtitle: "空き時間登録 & 面談予約"  # ヘッダーのサブタイトル
  icon: "🤝"                          # ヘッダーのアイコン絵文字
  event_label: "面談"                 # 予約の呼び名（面談 / レッスン / 施術 / カウンセリング など）

booking:
  start_hour: 9      # 予約枠の開始時刻（この時刻から30分単位）
  end_hour: 22       # 最終枠の終了時刻（21:30-22:00 が最終枠になる）
  days_ahead: 21     # 予約ページに表示する日数

# 予約を受け付ける人（スタッフ）の一覧。
# slug: URL に使う英数字（/book/<slug>）。一度公開したら変更しない。
# name: 画面に表示する名前。空き時間・予約データのキーにもなるので変更しない。
members:
  - slug: kazuto
    name: kazuto
  - slug: amarin
    name: あまりん
  - slug: sana
    name: さな
  - slug: shi
    name: しー
  - slug: kapinosuke
    name: かぴのすけ

line:
  reminder_hours_before: 24   # 面談の何時間前にLINEリマインドを送るか
