# /goods で販売する商品の設定
# 商品を増やす・編集するときはこのファイルを編集するだけでOK（コード変更不要）
#
# id          : 注文と紐付けるための識別子。一度公開したら変更しないこと（変更すると別商品扱いになる）
# name        : 商品名（購入ページ・決済画面・管理画面に表示される）
# price       : 価格（円・税込の整数で指定）
# description : 商品の説明文（任意、購入ページに表示）
# image       : 商品写真のパス（任意、省略時はアイコン表示。src/static/ 以下に画像を置き "/static/..." で指定）

products:
  - id: "chaco-mug-001"
    name: "chacoデザインマグカップ"
    price: 2190
    description: "chacoデザインのオリジナルマグカップです（送料込み）。"
    image: "/static/goods/chaco-mug.jpg"

  - id: "chaco-tshirt-001"
    name: "chacoデザインTシャツ 6.6oz"
    description: "chacoオリジナルデザインの6.6ozヘビーウェイトTシャツ（送料込み）。\nカラー・デザイン・サイズをお選びください。"
    variants:
      size:
        - label: "S"
          price: 3500
        - label: "M"
          price: 3500
        - label: "L"
          price: 3500
        - label: "XL"
          price: 3500
        - label: "XXL"
          price: 4500
      color:
        - label: "チャコール"
        - label: "ホワイト"
      design:
        - label: "センター"
        - label: "スモール"
    images:
      - path: "/static/goods/tshirt-charcoal-center.webp"
        color: "チャコール"
        design: "センター"
      - path: "/static/goods/tshirt-charcoal-small.webp"
        color: "チャコール"
        design: "スモール"
      - path: "/static/goods/tshirt-white-center.webp"
        color: "ホワイト"
        design: "センター"
      - path: "/static/goods/tshirt-white-small.webp"
        color: "ホワイト"
        design: "スモール"
