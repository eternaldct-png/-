services:
  - type: web
    name: kazuto-post-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.web_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: WEB_PASSWORD
        sync: false          # ログインパスワード（任意の文字列を設定、/goods/admin にも使用）
      - key: ANTHROPIC_API_KEY
        sync: false          # 投稿文生成に必要
      - key: STRIPE_SECRET_KEY
        sync: false          # 商品購入ページ /goods の決済に必要（https://dashboard.stripe.com/apikeys）
      - key: FLASK_SECRET_KEY
        sync: false          # /goods/admin のログインセッション用（任意の文字列を設定）

  - type: web
    name: eternal-schedule
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.schedule_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: SCHEDULE_PASSWORD
        sync: false          # スケジュールアプリのログインパスワード（任意の文字列）
      - key: FLASK_SECRET_KEY
        sync: false          # セッション用秘密鍵（任意の文字列）
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # Google サービスアカウントの JSON キー（Google Calendar 同期用）
      - key: GOOGLE_CALENDAR_ID
        sync: false          # 同期先カレンダー ID（省略時: primary）

  - type: web
    name: eternal-interview-booking
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.booking_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false          # セッション用秘密鍵（任意の文字列）
      - key: AVAILABILITY_PASSWORD
        sync: false          # /availability ログインパスワード（未設定時のデフォルト: ETERNALLOVE）
      - key: DATABASE_URL
        sync: false          # Supabase の接続 URI（任意。未設定時はファイルに保存）
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # Google サービスアカウントの JSON キー（Google Calendar 同期用）
      - key: GOOGLE_CALENDAR_ID
        sync: false          # eternal.d.c.t@gmail.com と共有したカレンダー ID
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false          # LINE Messaging API チャネルアクセストークン（LINE通知に必要・任意）
      - key: LINE_CHANNEL_SECRET
        sync: false          # LINE チャネルシークレット（Webhook 署名検証に必要・任意）
      - key: REMINDER_SECRET
        sync: false          # /tasks/send-reminders 用トークン（未設定時は AVAILABILITY_PASSWORD）
