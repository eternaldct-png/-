<!--
  eternaldct.net トップページ用「動画制作」の項目（カード型リンク）
  使い方: トップページの「カスタムHTML」ブロック（またはカスタムHTMLウィジェット）に、このファイルの中身をまるごと貼り付ける。
  リンク先は固定ページ https://eternaldct.net/motion/ 。src/wordpress_motion.py で追加するときは、実際のページURLに自動で差し替わる。
  画像を使わない（CSSだけの）デザインなので、Render のスリープ中でもトップページの表示は遅くならない。
-->
<style>

.edct-mcard::before {

}
@keyframes edct-drift { from { transform: translate(-4%, -3%) rotate(0deg); } to { transform: translate(4%, 3%) rotate(8deg); } }

}
.edct-mcard .edct-mcard__title { font-size: clamp(22px, 3.4vw, 30px); font-weight: 900; line-height: 1.4; color: #fff; }

.edct-mcard .edct-mcard__btn {

.edct-mcard .edct-mcard__screen::after {
  content: ""; width: 0; height: 0; margin-left: 4px;

  border-color: transparent transparent transparent rgba(255, 255, 255, 0.9);
}
.edct-mcard .edct-mcard__screen--wide { left: 0; top: 40px; width: 150px; height: 84px; background: linear-gradient(135deg, #312e81, #7c3aed); }

.edct-mcard .edct-mcard__screen--square { left: 66px; top: 104px; width: 64px; height: 64px; background: linear-gradient(135deg, #7c3aed, #ec4899); animation-delay: -3.2s; }
@keyframes edct-float { from { transform: translateY(-4px); } to { transform: translateY(5px); } }
@media (max-width: 599px) {
  .edct-mcard { flex-direction: column-reverse; align-items: stretch; gap: 18px; padding: 26px 20px; }

  .edct-mcard .edct-mcard__btn { display: block; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {

}
</style>
