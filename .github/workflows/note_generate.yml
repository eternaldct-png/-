name: note 下書き自動生成 (kazuto)

on:
  schedule:
    # 月曜 7:00 JST (UTC 日曜 22:00)
    - cron: "0 22 * * 0"
    # 火曜 7:00 JST (UTC 月曜 22:00)
    - cron: "0 22 * * 1"
    # 水曜 7:00 JST (UTC 火曜 22:00)
    - cron: "0 22 * * 2"
    # 木曜 7:00 JST (UTC 水曜 22:00)
    - cron: "0 22 * * 3"
    # 金曜 7:00 JST (UTC 木曜 22:00)
    - cron: "0 22 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（ファイル保存しない）'
        required: false
        default: 'false'
        type: boolean
      count:
        description: '生成本数（1〜5）'
        required: false
        default: '1'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate kazuto note article
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          COUNT="${{ inputs.count || '1' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          for i in $(seq 1 $COUNT); do
            echo "=== 記事生成 ${i}/${COUNT} ==="
            if [ "$DRY_RUN" = "true" ]; then
              python src/main.py --platform note --persona persona/kazuto_config.yaml --dry-run
            else
              python src/main.py --platform note --persona persona/kazuto_config.yaml
            fi
          done

      - name: Commit article files
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posts/note/
          git diff --staged --quiet || git commit -m "chore: note記事生成 (kazuto) [skip ci]"
          git push || true
