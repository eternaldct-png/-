name: Booking DB Keepalive

# Supabase の無料プランは一定期間アクセスがないとプロジェクトが自動で一時停止し、
# 面談予約アプリ（eternal-interview-booking）が「データベース未接続」になる。
# 3日ごとに予約ページの空き枠APIを叩き、Render を起こしつつ DB に読み取りを発生させて停止を防ぐ。

on:
  schedule:
    # 3日ごと 10:00 JST (UTC 1:00)
    - cron: "0 1 */3 * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping booking app (reads availability from Supabase)
        run: |
          # Render の無料プランはスリープ復帰に最大1分ほどかかるため、待ち時間を長めにして再試行する
          for slug in kazuto amarin sana shi kapinosuke; do
            curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
              "https://eternal-interview-booking.onrender.com/api/book/${slug}/slots" > /dev/null
            echo "ok: ${slug}"
          done
