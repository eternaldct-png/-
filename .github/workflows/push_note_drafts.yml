name: note 下書きアップロード

# 手動実行のみ。以前は記事ファイルの push のたびに自動実行していたが、
# 機能ブランチへの push でも走り、そのたびに全記事ぶん note へログインし直して
# 「しばらくたってからもう一度お試しください」とブロックされていた。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'アップロードする件数（新しい順）'
        required: false
        default: '3'
        type: string

concurrency:
  group: push-note-drafts
  cancel-in-progress: false

jobs:
  push-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt playwright && python -m playwright install chromium --with-deps

      - name: note.com に下書きをアップロード
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_SESSION_TOKEN: ${{ secrets.NOTE_SESSION_TOKEN }}
          # /note-drafts で手動で「下書き作成済」「公開済」にした記事をスキップするため（任意）
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTE_MAX_UPLOADS: ${{ inputs.limit }}
        run: python src/push_note_drafts.py

      # 失敗した場合も、失敗理由（history.json）を /note-drafts に出すためにコミットする
      - name: アップロード結果をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/note/articles/ posts/note/history.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: note下書きアップロード結果を記録 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
