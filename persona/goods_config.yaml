# /goods で販売する商品の設定
# 商品を増やす・編集するときはこのファイルを編集するだけでOK（コード変更不要）
#
# id          : 注文と紐付けるための識別子。一度公開したら変更しないこと（変更すると別商品扱いになる）
# name        : 商品名（購入ページ・決済画面・管理画面に表示される）
# price       : 価格（円・税込の整数で指定）
# description : 商品の説明文（任意、購入ページに表示）

products:
  - id: "sample-001"
    name: "サンプル商品"
    price: 3000
    description: "ここに商品の説明を書いてください。販売したい商品に合わせて自由に編集・追加できます。"
