# /waku（枠周り記録・歌推しチェック）の設定
# 選択肢や歌推しの条件を変えるときはこのファイルを編集するだけでOK（コード変更不要）
# 記録そのものはサーバーには保存されず、使う人のスマホ（ブラウザ）の中に保存される。
#
# ── page ─────────────────────────────────────
# title : ページの見出し（ブラウザのタブにも表示）
#
# ── 入力フォームのプルダウン ─────────────────────
# viewing_minutes : 「視聴時間」の選択肢（分）。0（なし）は自動で先頭に入る
# coin_presets    : 「コイン」の選択肢。0（なし）と「その他（直接入力）」は自動で入る
#
# ── uta_oshi（歌推しの条件） ──────────────────────
# 出典: 歌推し計算ツール（salon-tools の app/coloring_calculator.html）
#       https://thunderous-rugelach-1c3cc5.netlify.app/coloring_calculator
# 計算ツール側の数値が変わったら、ここの tiers も同じように直す。
#
# 歌推しの判定（カラーシングのルール）
#   - 視聴時間・コイン・スーパーいいねは上旬／中旬／下旬ごとにゼロに戻る
#   - 各旬の推しPtは、その旬の記録でクリアしたいちばん上の段階（tiers）
#   - 月間推しPt = 上旬 + 中旬 + 下旬。月が変わると完全にリセット
#   - 月間推しPtが目標（1K）以上で歌推し
#
# min_target     : 目標のプルダウンに出す一番下の推しPt（歌推しは1Kから）
#                  ※それより下の段階も旬ごとの推しPtの計算に使うので tiers からは消さない
# default_target : 「歌推し」タブで最初に選ばれている目標の推しPt（tiers の label のどれか）
# pattern_names  : パターン A / B / C の名前（計算ツールと同じ）
# tiers          : 推しPtごとの条件。patterns は [A, B, C] の順に3つ
#                  coins           : 必要なコイン数
#                  viewing_hours   : 必要な視聴時間（時間。0.25 = 15分 / 0 = 不要）
#                  super_like_days : 必要なスーパーいいね（日数。0 = 不要）
# high_tiers     : 50K以上は計算式で作る（計算ツールと同じ式）
#                  coins = base_coins + (K - 49) × coins_per_k

page:
  title: "枠周り記録"

viewing_minutes: [5, 10, 15, 20, 30, 45, 60, 75, 90, 105, 120, 150, 180, 210, 240, 300, 360, 420, 480, 600, 720]

coin_presets: [1, 5, 10, 20, 25, 30, 40, 50, 60, 80, 100, 150, 200, 250, 300, 400, 500, 600, 800, 1000, 1500, 2000, 3000, 5000, 10000]

uta_oshi:
  min_target: "1K"
  default_target: "1K"
  pattern_names: ["コイン節約型", "バランス型", "コイン一括型"]
