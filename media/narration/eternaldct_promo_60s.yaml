# ETERNAL d.c.t 60秒プロモ動画（eternaldct_promo_60s.mp4）のナレーション — ライバー募集重視版
#
# 作り方:
#   python3 src/narration_builder.py media/narration/eternaldct_promo_60s.yaml --video eternaldct_promo_60s.mp4
#
# at / until: そのセリフを置く区間（秒）。音声が区間より長いと最大1.2倍速まで自動で詰める。
# text: Gemini TTS に渡す文。読み間違い防止のため AI→エーアイ、50名→ごじゅうめい などカタカナ・ひらがなで書く。
# セリフを直したら、その行だけ作り直される（変わっていない行はキャッシュを使うので無料枠を節約できる）。

voice: Sulafat          # 女性・あたたかい声。候補: Aoede（軽やか）/ Kore（しっかり）/ Achernar（ソフト）
style: "落ち着いた女性ナレーター。ブランドCMのように、温かく、少し感情を込めて"
bgm_duck_db: 9          # ナレーション中に BGM を何 dB 下げるか

cues:
  - at: 0.3
    until: 4.0
    text: "その「好き」を、ずっと、届けたい。"
    style: "静かに、語りかけるように"

  - at: 4.5
    until: 11.5
    text: "エターナル・ディクト。<short pause> ライブ、音楽、エーアイ、グッズ。"

  - at: 12.0
    until: 18.0
    text: "歌う。配信する。つくる。つなぐ。届ける。支える。"
    style: "テンポよく、力強く、一語ずつ区切って"

  # ── ライバー募集を厚く ──
  - at: 18.2
    until: 26.0
    text: "ライバー事務所。歌が好きなら、未経験でも、応募できます。所属ライバー、ごじゅうめい。"
    style: "明るく、親しみやすく、背中を押すように"

  - at: 26.6
    until: 31.8
    text: "音楽制作。あなたの声を、作品に。"

  # AI・グッズは短くして、ライバー募集に比重を寄せる
  - at: 32.3
    until: 39.7
    text: "エーアイ業務効率化。空いた時間を、「好き」へ。"

  - at: 40.3
    until: 45.7
    text: "グッズ。あなたの「好き」を、カタチに。"

  - at: 48.2
    until: 51.8
    text: "その「好き」を、<short pause> エターナルに。"
    style: "ゆっくり、余韻を残して"

  - at: 52.5
    until: 59.0
    text: "ライバー、募集中。オーディションは、公式サイトから。"
    style: "はっきり、明るく、呼びかけるように"
