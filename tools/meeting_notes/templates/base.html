<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}キキトメ{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='mark.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='mark.svg') }}" alt="" width="24" height="24"> キキトメ</a>
    <nav aria-label="メニュー">
      <a href="{{ url_for('index') }}" {% if nav in ('index', 'meeting') %}aria-current="page"{% endif %}>会議</a>
      <a href="{{ url_for('actions') }}" {% if nav == 'actions' %}aria-current="page"{% endif %}>やること</a>
      <a href="{{ url_for('ask_page') }}" {% if nav == 'ask_page' %}aria-current="page"{% endif %}>AIに聞く</a>
      <a href="{{ url_for('settings_page') }}" {% if nav == 'settings_page' %}aria-current="page"{% endif %}>設定</a>
    </nav>
    <a class="btn btn-primary btn-sm" href="{{ url_for('new') }}">＋ 新しい会議</a>
  </div>
</header>
<main id="main">
{% if not api_key_ok %}
  <p class="notice notice-danger" role="alert">「設定」で Claude API を選んでいますが、ANTHROPIC_API_KEY がありません。「設定」で「端末内AI」か「AIなし」に切り替えると、APIなしで使えます。</p>
{% endif %}
{% block main %}{% endblock %}
</main>
<div id="toast" aria-live="polite"></div>
{% block scripts %}{% endblock %}
</body>
</html>
