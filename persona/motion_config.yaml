# /motion（モーション動画の作例ページ）の設定
# 作例を増やす・編集するときはこのファイルを編集するだけでOK（コード変更不要）
#
# ── page（ページ全体） ──────────────────────────────
# title         : ページの見出し（ブラウザのタブにも表示）
# lead          : 見出しの下の説明文
# contact_url   : 「相談する」ボタンのリンク先（公式LINEの友だち追加URLなど。https:// のみ。空ならボタン非表示）
# contact_label : ボタンの文言
#
# ── works（作例1本ごと） ───────────────────────────
# id          : 識別用（英数字とハイフン。ファイル名と揃えると管理しやすい）
# title       : 作例名
# category    : カテゴリ（同じ文字列の作例がまとまり、ページ上部の絞り込みボタンになる）
# description : 説明文（任意）
# aspect      : 縦横比 "16:9" / "9:16" / "1:1" / "4:5" のどれか（必ず "" で囲む）
# video       : 動画ファイル（src/static/motion/ に置き "/static/motion/xxx.mp4"、または https:// のURL）
# poster      : 読み込み前に表示するサムネイル画像（任意・推奨）
# youtube     : YouTube のURLまたは動画ID（長尺・音あり向け。video とどちらか一方を指定）
# duration    : 尺の表示（例: "15秒"）
# use         : 用途の表示（例: "Instagramリール・TikTok広告"）
#
# video も youtube も空の作例は「制作中」扱いになり、公開ページには表示されない。
# 制作中の枠も含めてレイアウトを確認したいときは /motion?preview=1 を開く。

page:
  title: "こんな動画、つくれます。"
  lead: "配信・音楽・SNS広告・店舗や企業のPRまで。\nETERNALd.c.t が制作するモーション動画の作例集です。"
  contact_url: ""
  contact_label: "制作について相談する"

