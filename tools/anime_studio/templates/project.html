{% extends "base.html" %}
{% block title %}{{ p.title or '作品' }} — コマドリ{% endblock %}
{% block main %}
<div class="between">
  <h1 id="ptitle">{{ p.title or '（題名なし）' }}</h1>
  <div class="row"><span class="small muted" id="pmeta"></span><button class="btn sm danger" id="del-project" type="button">作品を消す</button></div>
</div>
<nav aria-label="段階"><ol class="stepper" id="stepper"></ol></nav>
<div class="ws">
  <aside class="card chat" aria-label="制作チームとのやりとり">
    <details class="rules" id="rules-box">
      <summary class="small"><b>📌 この作品の決まりごと</b> <span class="xs muted" id="rules-count"></span></summary>
      <form id="rules-form">
        <label class="sr-only" for="rules">この作品の決まりごと</label>
        <textarea id="rules" maxlength="4000" placeholder="例）あまりんは関西弁。語尾は「〜やで」。&#10;明るい終わり方にする。"></textarea>
        <p class="xs muted">どの段階でも、毎回AIに最優先で渡します（指示より決まった流れが優先されないように）。いつもの決まりごとは「設定」で。</p>
        <button class="btn sm ink" type="submit">保存</button>
      </form>
    </details>
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <form id="chat-form">
      <label class="sr-only" for="instruction">今の段階への指示</label>
      <textarea id="instruction" maxlength="2000" placeholder="例）もっと明るい終わり方にして／2人目のキャラを足して"></textarea>
      <div class="between" style="margin-top: var(--sp-2)">
        <span class="xs muted" id="engine-label"></span>
        <button class="btn primary sm" type="submit">この段階を作り直す</button>
      </div>
    </form>
  </aside>
  <section class="panel" id="panel" aria-live="polite"></section>
</div>
{% endblock %}
{% block scripts %}
<script>window.PID = {{ p.id | tojson }}; window.CAMERAS = {{ CAMERAS | tojson }}; window.STAGE_LIST = {{ STAGES | tojson }};</script>
<script src="{{ url_for('static', filename='project.js') }}"></script>
{% endblock %}
