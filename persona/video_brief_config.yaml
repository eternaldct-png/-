# ─────────────────────────────────────────────────────────────
# /video-brief（AI動画の制作指示書メーカー）の設定
#
# コード変更なしで、ここを書き換えてコミットするだけで反映される。
# 中身の元ネタと考え方は docs/video_production_playbook.md を参照。
# ─────────────────────────────────────────────────────────────

title: "AI動画 制作指示書メーカー"

# 指示書を書く Claude のモデル
model: "claude-opus-5-5"

# セリフ・ナレーションの読める速さ（1秒あたりの文字数）。これを超えると早口になる
chars_per_second: 8

# 動画生成AIが1回で作れる長さの目安（秒）。これより長いカットは分けるよう警告する
# 2026年10月時点の目安。使うモデルの最新の上限に合わせて直す
max_clip_seconds: 30

# 縦横比の選択肢
aspects: ["16:9", "9:16", "1:1", "4:5", "2.39:1"]

# 全ジャンル共通の土台（指示書の冒頭とAIへのルールに入る）
foundations:
  - "制作は ①台本（秒割り） → ②原型画像 → ③動画化 → ④音楽・SE → ⑤編集 の順。順番を飛ばさない"
  - "原型画像（最初のフレーム）の段階でOKをもらってから動画化する。動画になってからの作り直しが一番高くつく"
  - "カットをつなぐときは、前のカットの最後のフレームを次のカットの最初の画像に入れる"
  - "つなぎ目は動きの途中で切る（止まった状態でつなぐと、つないだのが見えてしまう）"
  - "モデルは1つにこだわらず、カットごとに得意なモデルを使い分ける"
  - "確認は低画質の下書きで出し、OKが出たカットだけ高画質（1080p以上）で仕上げる"
  - "文字（コピー・ロゴ・ボタン）はAIで生成しない。映像は文字なしで作り、文字は編集で後から載せる"
  - "うまくいった手順・プロンプト・参照画像は案件フォルダに残し、次の案件で使い回す"

# 権利・確認まわり（全ジャンル共通でチェックリストに入る）
compliance:
  - "人物はオリジナルの顔で作り、実在の人・有名人に似ていないかを確認した"
  - "使う曲・BGM・効果音が商用利用できるライセンスか確認した"
  - "クライアント提供の写真・ロゴ・設定画を使う許可を取った"
  - "店名・価格・数値など、事実でない表記はサンプル表記として扱っている（または事実を確認した）"

# 見積もりの考え方（指示書の最後に入る）
estimate:
  - "見積もり = 生成の原価（クレジット）× 作り直しの回数 ＋ 企画・台本・編集の作業費"
  - "生成回数よりも『キャラクター設計・台本を固める工数』を軸に考える（時間がかかるのはそこ）"
  - "下書き → 本番の2段階にすると、クレジットの無駄が減る"

# ジャンルごとの勝ちパターン
# - references: 先に用意する参照素材（指示書の「準備するもの」になる）
# - rules: このジャンルで守ること（AIへのルールにも入る）
# - upsell: 一緒に提案できる追加納品物
genres:
  - id: anime
    name: "アニメ風CM"
    use: "店舗・新商品の告知、ライバー・キャラのPR"
    default_seconds: 30
    default_aspect: "16:9"
    references:
      - "キャラクターの三面図（正面・横・後ろ）"
      - "お店・舞台の背景画像"
      - "商品の画像"
    rules:
      - "三面図を参照画像として最初に固定する（入れないとカットごとに顔・髪型・服の色が変わる）"
      - "セリフと動きを秒単位で割った台本を、そのまま動画プロンプトに入れる"
      - "1回で作れる長さに収まるなら、途中でつながずに1回で生成する"
      - "最後にロゴとキャッチコピーの締めカットを入れる"
    upsell:
      - "同じキャラ・同じ台本の型で、商品だけ差し替えたシリーズ展開"
    keep_for_series:
      - "三面図"
      - "秒割り台本"

  - id: corporate
    name: "実写風の企業紹介・映画予告風CM"
    use: "会社紹介、採用、ブランドムービー、作品の予告編"
    default_seconds: 30
    default_aspect: "16:9"
    references:
      - "会社・工場・商品の写真（先方から借りる）"
      - "登場キャラ・ロボット等の設定画（いる場合）"
    rules:
      - "カメラの種類・レンズ（広角/望遠）・絞り・照明・色味・映画の年代やジャンルをプロンプトに書く（書かないとAIっぽく・チープになる）"
      - "企業紹介は派手さより信頼感。カメラはゆっくり、カット数は少なめ、色味は落ち着いたナチュラル"
      - "予告編は一番エモーショナルな瞬間で切り、結末は見せない"
      - "下書き（480p程度）で確認 → OKのカットだけ1080pで仕上げ"
    upsell:
      - "同じ素材で採用向け・展示会向けの短尺版"

  - id: pov
    name: "POV（一人称視点）CM"
    use: "不動産の内見、観光地のPR、店舗・施設の紹介"
    default_seconds: 15
    default_aspect: "16:9"
    references:
      - "最初の画像（例: 建築模型・外観・地図）"
      - "最後の画像（例: 完成した部屋・目的地）"
    rules:
      - "最初の画像と最後の画像を両方指定する（ゴールが決まっていないと途中でワープする）"
      - "変化の順番をプロンプトに書く（例: 模型に近づく → 中に入る → 実物に変わる → 中を歩く）"
      - "カメラは『ゆっくり前に進む』『目線の高さを保つ』と書く（書かないと急に上を向く・見下ろす）"
      - "1本で全部やらず、入る瞬間ごとに区切る（外観→玄関、玄関→リビング…）。延長機能で続けてもよい"
    upsell:
      - "提案の場で、相手の模型・パース1枚から試作を見せる"

  - id: exploded
    name: "構造分解CM"
    use: "腕時計・家電・コスメ・スニーカーなど、中身にこだわりがある商品"
    default_seconds: 15
    default_aspect: "1:1"
    references:
      - "組み上がった状態の画像"
      - "分解した状態の画像（パーツ数と並び順を決めて作る）"
      - "商品の実写写真（あれば必ず）"
    rules:
      - "組み上がり・分解の2枚を先に作り、最初と最後の画像に指定する"
      - "パーツの数と並び順を決めて書く（例: パーツは7層、前から順に…）。決めないと毎回増減する"
      - "背景は単色（黒など）でシンプルに。パーツが分かれる瞬間に光を走らせると精密さが際立つ"
      - "『組み上がり→分解』『分解→組み上がり』は2本に分けて生成する"
    upsell:
      - "同じ素材からSNS広告用の静止画バナー（正方形・縦長）をセットで納品"

  - id: motion_graphics
    name: "モーショングラフィックスCM"
    use: "アプリ・サービス紹介、告知、ロゴアニメーション"
    default_seconds: 15
    default_aspect: "16:9"
    references:
      - "ロゴ（透過PNG）"
      - "キャッチコピーの確定版"
    rules:
      - "映像は文字なしで生成し、コピー・ロゴは編集で後から載せる"
      - "『◯秒で色が切り替わる』『◯秒で図形が弾ける』と、秒単位で動きの区切りを決める（文字を載せるタイミングになる）"
      - "色は最初に3色だけ決める（メイン・アクセント・背景）"
    upsell:
      - "縦長・正方形などのサイズ違い（リフレーム）"
      - "コピー違いの差し替え版（文字だけ差し替えればよい）"

  - id: app_game
    name: "アプリ・ゲームの3D縦型CM"
    use: "アプリ・ゲーム・配信アプリの広告"
    default_seconds: 15
    default_aspect: "9:16"
    references:
      - "キャラクターの公式設定画（三面図として使う）"
      - "アプリの画面キャプチャ（文字・ボタンは編集で載せる）"
    rules:
      - "縦長9:16で作り、冒頭2秒に一番派手なシーンを持ってくる（指を止めさせる）"
      - "プロンプトは実際にアプリを使う流れで秒ごとに書く（ただのキャラ紹介にしない）"
      - "最後はダウンロードなどの呼びかけで締める"
      - "アプリ画面の文字・ボタンはAIだとつぶれるので、編集で差し替える"
    upsell:
      - "冒頭フック違い・最後の呼びかけ違いのABテスト用パターン（本編は作り直さない）"
      - "キャラ・言語を変えた海外向け版"

  - id: music_video
    name: "MV風CM"
    use: "楽曲・アーティストのプロモーション、香水・アパレルなどのブランド広告"
    default_seconds: 30
    default_aspect: "16:9"
    references:
      - "使う曲（先に決める。商用利用できるもの）"
      - "ダンスなどのお手本動画（動きを写す場合）"
    rules:
      - "先に曲を用意し、音声を参照に入れてから映像を生成する（映像が先だと曲に合わせるのが大変）"
      - "サビの直前で一度音を止め、サビの頭で一気にカットを切り替える"
      - "ダンスなどの動きは、お手本動画の動きをキャラに写して指定する"
    upsell:
      - "ナレーション入りなら多言語の吹き替え版（リップシンク付き）"

# ── 下書き動画の自動生成（480p・使った分だけ課金） ───────────────────
# 指示書のカットごとに「🎬 下書きを作る」ボタンが出る。本番（1080p）は人が手で作る。
# fal.ai のキュー型API（https://queue.fal.run）を使う。APIキーは Render の環境変数 FAL_KEY に入れる。
# モデルIDと480pの単価（$0.2205/秒）は 2026年10月20日に fal.ai のモデルページで確認済み。
draft:
  enabled: true
  api_key_env: "FAL_KEY"
  # 最初の画像URLなし → text_to_video、あり → image_to_video
  text_to_video_model: "bytedance/seedance-2.5/us/text-to-video"
  image_to_video_model: "bytedance/seedance-2.5/us/image-to-video"
  resolution: "480p"
  # 単価（ドル/秒）と為替（円/ドル）。表示する金額と予算の計算に使う
  usd_per_second: 0.2205
  jpy_per_usd: 155
  # 月の上限（円）。これを超える下書きは作らない（日本時間の月初にリセット）
  # fal.ai の管理画面でも上限を設定しておくこと（こちらは見積もりベースの安全装置）
  monthly_budget_jpy: 5000
  # 1回で作る秒数の範囲（カットの尺をこの範囲に丸める）
  min_seconds: 4
  max_seconds: 15
  # 画面の縦横比 → モデルに送る値（モデルが受け付けない比率だけ書き換える）
  aspect_map:
    "2.39:1": "21:9"
  # duration を "5" のような文字列で送るか（モデルの仕様に合わせる）
  duration_as_string: true
  # モデルに追加で渡す入力（例: generate_audio: false）
  extra_input:
    generate_audio: false
