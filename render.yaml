services:
  - type: web
    name: kazuto-post-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir src web_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: WEB_PASSWORD
        sync: false          # Render のダッシュボードで手動設定
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
